<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintainence</title>

    <!-- Tailwind CSS -->
    <script src="assets/js/tailwind.js"></script>
    <script src="assets/js/alpine.js" defer></script>

    <!-- Icons -->
    <link rel="stylesheet" href="assets/boxicons/css/boxicons.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="flex flex-col lg:flex-row w-full max-w-6xl shadow-xl rounded-lg overflow-hidden">

        <!-- Left Image Section -->
        <div class="lg:w-5/12 hidden lg:flex items-center justify-center bg-gray-200">
            <img src="assets/images/painting-tree-with-sunset-background_544662-182.jpg" alt="Dashboard Image" class="object-cover w-full h-[450px]">
        </div>

        <!-- Right Content Card -->
        <div class="lg:w-7/12 w-full flex flex-col justify-center items-center p-8 bg-gradient-to-tr from-red-500 to-blue-500 text-white">
            
            <!-- Logo/Title -->
            <h1 class="text-3xl font-bold mb-6">DesigncodeIT</h1>

            <!-- Middle Image -->
            <img src="assets/images/20945577.jpg" 
                 alt="Maintenance Image" class="w-40 h-40 mb-6 shadow-lg rounded-full">

            <!-- Maintenance Text -->
            <div class="text-center mb-6">
                <h2 class="text-2xl font-semibold mb-2">Site is Under Maintenance</h2>
                <p>We're making the system more awesome. We'll be back shortly.</p>
            </div>

            <!-- Contact Us Button -->
            <a href="mailto:contact@designcodeit.com" 
               class="px-6 py-3 rounded-full bg-white text-red-500 font-semibold hover:bg-gray-100 transition">
               Contact Us
            </a>

        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" x-data="{ submitted: false }">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recover Password - DesigncodeIT</title>

  <script src="assets/js/tailwind.js"></script>
  <script src="assets/js/alpine.js" defer></script>

  <link rel="stylesheet" href="assets/boxicons/css/boxicons.min.css" />
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center min-h-screen p-4">

  <div class="flex flex-col lg:flex-row w-full max-w-6xl shadow-lg rounded-xl overflow-hidden bg-white">

    <!-- Left image (desktop only) -->
    <div class="lg:w-5/12 hidden lg:flex items-stretch">
      <img src="assets/images/painting-tree-with-sunset-background_544662-182.jpg"
           alt="Recover Image"
           class="object-cover w-full h-full">
    </div>

    <!-- Right card -->
    <div class="lg:w-7/12 w-full flex flex-col justify-center items-center p-6 md:p-8 text-gray-900">
      <!-- Header + small controls -->
      <div class="w-full max-w-md">
        <div class="flex items-center justify-center mb-4">
          <div>
            <h1 class="text-2xl font-bold text-blue-600">DesigncodeIT</h1>
            <p class="text-sm text-gray-500">Recover your account</p>
          </div>
        </div>

        <!-- Card -->
        <div class="bg-gray-50 border border-transparent rounded-lg p-4 md:p-6 shadow-sm">
          <!-- Not submitted: show email input -->
          <template x-if="!submitted">
            <div>
              <h2 class="text-lg font-semibold mb-2 text-gray-800">Forgot your password?</h2>
              <p class="text-sm text-gray-500 mb-4">Enter your account email and we'll send a reset link.</p>

              <form @submit.prevent="submitted = true" class="space-y-3">
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <i class="bx bx-envelope text-gray-400"></i>
                  </span>
                  <input type="email" required placeholder="you@example.com"
                         class="w-full pl-10 pr-3 py-2.5 rounded-lg bg-white border border-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
                </div>

                <button type="submit"
                        class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-lg font-semibold text-white text-sm hover:from-blue-700 hover:to-indigo-700 transition">
                  Send Reset Link
                </button>

                <div class="flex items-center justify-between mt-1 text-xs">
                  <a href="login.html" class="text-blue-600 hover:underline">Back to login</a>
                  <a href="signup.html" class="text-gray-500 hover:underline">Create account</a>
                </div>
              </form>
            </div>
          </template>

          <!-- After submit: success message -->
          <template x-if="submitted">
            <div class="text-center py-6">
              <div class="inline-flex items-center justify-center w-16 h-16 mx-auto mb-4 rounded-full bg-green-50">
                <i class="bx bx-check text-2xl text-green-600"></i>
              </div>
              <h3 class="text-lg font-semibold mb-1 text-gray-800">Check your email</h3>
              <p class="text-sm text-gray-600 mb-4">We've sent password reset instructions to <span class="font-medium">you@example.com</span>. Link expires in 60 minutes.</p>

              <div class="flex gap-2 justify-center">
                <a href="login.html" class="px-4 py-2 rounded-lg bg-white text-blue-600 font-medium hover:bg-gray-100 transition text-sm">Back to Login</a>
                <button @click="submitted = false" class="px-4 py-2 rounded-lg bg-transparent border border-gray-300 text-sm">Send again</button>
              </div>
            </div>
          </template>
        </div>

        <!-- small footer note -->
        <p class="text-xs text-center text-gray-500 mt-3">
          If you don't receive an email within a few minutes, check your spam folder or contact support.
        </p>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 Error - DesigncodeIT</title>

    <script src="assets/js/tailwind.js"></script>
    <script src="assets/js/alpine.js" defer></script>

    <link rel="stylesheet" href="assets/boxicons/css/boxicons.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        }
    </style>
</head>
<body class="bg-gradient-to-br from-red-50 to-orange-100 flex items-center justify-center min-h-screen p-4 md:p-8">

    <div class="flex flex-col lg:flex-row w-full max-w-7xl shadow-xl rounded-2xl overflow-hidden bg-white">

        <div class="lg:w-5/12 hidden lg:flex items-stretch">
            <img src="assets/images/painting-tree-with-sunset-background_544662-182.jpg" alt="500 Error Image - Server Issue" class="object-cover w-full h-full">
        </div>

        <div class="lg:w-7/12 w-full flex flex-col justify-center items-center p-8 md:p-12 lg:p-16 text-gray-900 text-center">

            <img src="assets/images/500-error-icon.png" 
                alt="Error 500" class="w-40 h-40 mb-6" onerror="this.onerror=null; this.src='assets/images/20945577.jpg';">

            <h1 class="text-4xl font-bold text-red-600 mb-2">Uh Oh!</h1>
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">500 - Internal Server Error</h2>

            <div class="mb-8">
                <p class="text-gray-600">
                    Something went wrong on our server. We're working to fix it!
                </p>
                <p class="text-sm mt-2 text-gray-500">
                    Please try refreshing the page or come back later.
                </p>
            </div>

            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                <button onclick="window.location.reload();"
                    class="px-8 py-3 rounded-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-700 hover:to-orange-700 text-white font-semibold transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-lg">
                    <i class="bx bx-refresh mr-1"></i> Try Again / Refresh
                </button>
                
                <a href="mailto:contact@designcodeit.com" 
                    class="px-8 py-3 rounded-full bg-transparent border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100 transition">
                    <i class="bx bx-envelope mr-1"></i> Report Issue
                </a>
            </div>

        </div>
    </div>

</body>
</html>
